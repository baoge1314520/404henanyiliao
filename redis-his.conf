# HIS 演示环境 Redis 配置
# 用法：redis-server.exe redis-his.conf（或把 start-his.cmd 里的启动行换成带本文件）
# 关键：dir 必须指向可写目录，否则 RDB 快照失败触发 MISCONF 禁写，
# 表现为页面写操作报"系统异常,请联系管理员"、登录态频繁掉线。
port 6379
bind 127.0.0.1
dir D:/tmp/redis-data
dbfilename dump-his.rdb
stop-writes-on-bgsave-error no
save 900 1 300 10 60 10000
appendonly no
server:
  ssl:
    enabled: false
  port: 8081
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.109.130:5432/db1
    username: postgres
    password: 123456789
    hikari:
      minimum-idle: 8
      maximum-pool-size: 20
      # 数据库在虚拟机里，NAT/休眠会掐断空闲 TCP 连接，池里会留下死连接，
      # 下次请求拿到死连接就抛异常 -> 前端"系统异常,请联系管理员"。
      # 缩短连接存活时间并主动保活，让死连接在被借用前就回收/探活。
      max-lifetime: 300000
      keepalive-time: 120000
      validation-timeout: 3000
      connection-timeout: 10000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
# 本地文件上传（医生头像）存储目录，相对后端工作目录，可改为绝对路径
his:
  upload:
    dir: uploads
logging:
  level:
    com.neuedu.mapper: debug
langchain4j:
  open-ai:
    chat-model:
      base-url: https://ws-9zdsmx8sl8gfyius.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: "your-llm-api-key"  # 已脱敏：本地运行前填回你自己的值
      model-name: qwen-plus
      timeout: 300000
      log-requests: false
      log-responses: false

# 支付宝电脑网站支付（沙箱）。把下面三行密钥换成你开放平台「研发-沙箱」里的值后重启后端即可。
# 私钥/公钥是账号专属机密，交作业前记得替换成占位符或删除本段，不要上传到公开仓库。
alipay:
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  app-id: "your-alipay-app-id"           # 例：9021000123456789
  private-key: "your-alipay-private-key"     # 长串 base64，不含 -----BEGIN/END----- 标记
  alipay-public-key: "your-alipay-public-key"  # 注意是“支付宝公钥”不是“应用公钥”
  notify-url: ""                       # 异步通知地址，本地演示可留空；需公网可用内网穿透
  return-url: http://127.0.0.1:8081/alipay/return
  sign-type: RSA2
  charset: UTF-8

